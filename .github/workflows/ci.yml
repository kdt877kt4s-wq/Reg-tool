name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, redis
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          echo "::notice title=Resolved versions::$(composer show laravel/framework pestphp/pest --format=text 2>/dev/null | grep -E '^(name|versions)' | tr '\n' ' ')"
      - name: Create restricted app role and test database
        # Same setup as local docker: the app is not a superuser, so
        # row-level security applies to every query the tests make.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ruleradar_app LOGIN PASSWORD 'ruleradar_app' NOSUPERUSER NOBYPASSRLS NOCREATEROLE" \
            -c "CREATE DATABASE ruleradar_test OWNER ruleradar_app"
          psql -h localhost -U postgres -d ruleradar_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate
      - name: Code style (Pint)
        run: |
          if ! vendor/bin/pint --test; then
            # Apply the fixes in the runner and report each file's diff as
            # an annotation, so the needed change is readable on the run.
            vendor/bin/pint > /dev/null || true
            for f in $(git diff --name-only -- .); do
              body=$(git diff -U0 -- "../../$f" | grep -E '^[+-][^+-]' | head -20 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error file=$f,title=Pint::${body}"
            done
            exit 1
          fi
      - name: Migrate and seed (runs the real migrations against Postgres + pgvector)
        env:
          DB_DATABASE: ruleradar_test
        run: |
          set -o pipefail
          php artisan migrate --force --seed 2>&1 | tee migrate.log
      - name: Report migration failure
        if: failure()
        run: |
          [ -f migrate.log ] && echo "::error title=Migrations::$(tail -c 1800 migrate.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')" || true
      - name: Tests (Pest)
        run: vendor/bin/pest --log-junit junit.xml
      - name: Report test failures
        if: failure()
        run: python3 ../../.github/scripts/junit-annotations.py junit.xml
      - name: Dependency audit
        run: composer audit

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log
      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Unit tests
        run: |
          set -o pipefail
          npm run test 2>&1 | tee test.log
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Report web failures
        if: failure()
        run: |
          for f in lint typecheck test build; do
            [ -f "$f.log" ] || continue
            body=$(grep -v '^\s*$' "$f.log" | tail -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=npm run $f::${body}"
          done
      - name: Dependency audit
        # Shipped (production) dependencies fail on high or critical.
        # Dev-only tooling (lint, test runner) fails on critical: it never
        # reaches users, and some lint-tooling advisories have no fix yet.
        run: |
          annotate() {
            jq -r --arg lvl "$2" '.vulnerabilities // {} | to_entries[]
              | select(.value.severity as $s | ($lvl == "high" and ($s == "high" or $s == "critical")) or ($lvl == "critical" and $s == "critical") or ($lvl == "warn" and ($s == "high")))
              | "::\(if $lvl == "warn" then "warning" else "error" end) title=npm audit (\($ARGS.named.scope))::\(.key) \(.value.range) [\(.value.severity)] via \([.value.via[] | if type == "string" then . else .title end] | join("; "))"' --arg scope "$3" "$1"
          }
          npm audit --omit=dev --json > audit-prod.json || true
          npm audit --json > audit-all.json || true
          annotate audit-prod.json high production
          annotate audit-all.json critical dev
          annotate audit-all.json warn dev
          echo "::notice title=Resolved versions::$(npm ls next react eslint-config-next vitest tailwindcss --depth=0 2>/dev/null | tail -n +2 | tr '\n' ' ')"
          npm run audit:prod
          npm run audit:dev

  infra:
    name: Infrastructure (Bicep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile Bicep
        run: az bicep install && az bicep build --file infra/main.bicep --stdout > /dev/null
