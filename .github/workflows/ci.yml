name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ruleradar
          POSTGRES_PASSWORD: ruleradar
          POSTGRES_DB: ruleradar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ruleradar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, redis
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          echo "::notice title=Resolved versions::$(composer show laravel/framework pestphp/pest --format=text 2>/dev/null | grep -E '^(name|versions)' | tr '\n' ' ')"
      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Migrate and seed (runs the real migrations against Postgres + pgvector)
        env:
          DB_DATABASE: ruleradar_test
        run: php artisan migrate --force --seed
      - name: Tests (Pest)
        run: vendor/bin/pest
      - name: Dependency audit
        run: composer audit

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: |
          # Surface each high/critical finding as an annotation so it is
          # readable on the run summary, then fail on them.
          npm audit --json > audit.json || true
          jq -r '.vulnerabilities // {} | to_entries[]
                 | select(.value.severity == "high" or .value.severity == "critical")
                 | "::error title=npm audit::\(.key) \(.value.range) [\(.value.severity)] via \([.value.via[] | if type == "string" then . else .title end] | join("; ")) | fix: \(.value.fixAvailable | tostring)"' audit.json
          echo "::notice title=Resolved versions::$(npm ls next react eslint-config-next tailwindcss --depth=0 2>/dev/null | tail -n +2 | tr '\n' ' ')"
          npm audit --audit-level=high

  infra:
    name: Infrastructure (Bicep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile Bicep
        run: az bicep install && az bicep build --file infra/main.bicep --stdout > /dev/null
