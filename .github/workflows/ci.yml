name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ruleradar
          POSTGRES_PASSWORD: ruleradar
          POSTGRES_DB: ruleradar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ruleradar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, redis
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          echo "::notice title=Resolved versions::$(composer show laravel/framework pestphp/pest --format=text 2>/dev/null | grep -E '^(name|versions)' | tr '\n' ' ')"
      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate
      - name: Code style (Pint)
        run: |
          vendor/bin/pint --test --format=json > pint.json || {
            jq -r '.files[]? | "::error file=apps/api/\(.name),title=Pint::fixers: \(.appliedFixers | join(", "))"' pint.json
            exit 1
          }
      - name: Migrate and seed (runs the real migrations against Postgres + pgvector)
        env:
          DB_DATABASE: ruleradar_test
        run: php artisan migrate --force --seed
      - name: Tests (Pest)
        run: vendor/bin/pest
      - name: Dependency audit
        run: composer audit

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit
        # Shipped (production) dependencies fail on high or critical.
        # Dev-only tooling (lint, test runner) fails on critical: it never
        # reaches users, and some lint-tooling advisories have no fix yet.
        run: |
          annotate() {
            jq -r --arg lvl "$2" '.vulnerabilities // {} | to_entries[]
              | select(.value.severity as $s | ($lvl == "high" and ($s == "high" or $s == "critical")) or ($lvl == "critical" and $s == "critical") or ($lvl == "warn" and ($s == "high")))
              | "::\(if $lvl == "warn" then "warning" else "error" end) title=npm audit (\($ARGS.named.scope))::\(.key) \(.value.range) [\(.value.severity)] via \([.value.via[] | if type == "string" then . else .title end] | join("; "))"' --arg scope "$3" "$1"
          }
          npm audit --omit=dev --json > audit-prod.json || true
          npm audit --json > audit-all.json || true
          annotate audit-prod.json high production
          annotate audit-all.json critical dev
          annotate audit-all.json warn dev
          echo "::notice title=Resolved versions::$(npm ls next react eslint-config-next vitest tailwindcss --depth=0 2>/dev/null | tail -n +2 | tr '\n' ' ')"
          npm run audit:prod
          npm run audit:dev

  infra:
    name: Infrastructure (Bicep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile Bicep
        run: az bicep install && az bicep build --file infra/main.bicep --stdout > /dev/null
