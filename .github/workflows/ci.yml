name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, redis
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        id: install
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          echo "::notice title=Resolved versions::$(composer show laravel/framework pestphp/pest --format=text 2>/dev/null | grep -E '^(name|versions)' | tr '\n' ' ')"
      - name: Create restricted app role and test database
        # Same setup as local docker: the app is not a superuser, so
        # row-level security applies to every query the tests make.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ruleradar_app LOGIN PASSWORD 'ruleradar_app' NOSUPERUSER NOBYPASSRLS NOCREATEROLE" \
            -c "CREATE DATABASE ruleradar_test OWNER ruleradar_app"
          psql -h localhost -U postgres -d ruleradar_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate
      - name: Migrate and seed (runs the real migrations against Postgres + pgvector)
        env:
          DB_DATABASE: ruleradar_test
        run: |
          set -o pipefail
          php artisan migrate --force --seed 2>&1 | tee migrate.log
      - name: Report migration failure
        if: failure()
        run: |
          [ -f migrate.log ] && echo "::error title=Migrations::$(tail -c 1800 migrate.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')" || true
      - name: Tests (Pest)
        run: vendor/bin/pest --log-junit junit.xml
      - name: Report test failures
        if: failure()
        run: python3 ../../.github/scripts/junit-annotations.py junit.xml
      - name: Code style (Pint)
        if: always() && steps.install.outcome == 'success'
        run: |
          if ! vendor/bin/pint --test; then
            # Apply the fixes in the runner and report each file's diff as
            # an annotation, so the needed change is readable on the run.
            vendor/bin/pint > /dev/null || true
            for f in $(git diff --name-only -- .); do
              body=$(git diff -U0 -- "../../$f" | grep -E '^[+-][^+-]' | head -20 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error file=$f,title=Pint::${body}"
            done
            exit 1
          fi
      - name: Live Federal Register check
        # Polls the real Federal Register for the last 7 days into the CI
        # database and reports what happened. Not blocking: an outage there
        # must not fail our build, but the result is visible on every run.
        continue-on-error: true
        env:
          DB_DATABASE: ruleradar_test
          QUEUE_CONNECTION: sync
        run: |
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          code=0
          php artisan migrate:fresh --force --seed > live-migrate.log 2>&1 || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning title=Live check: migrate failed::$(tail -c 2500 live-migrate.log | enc)"; exit 1
          fi
          php artisan ruleradar:poll federal_register --days=7 > live-poll.log 2>&1 || code=$?
          report=$(php artisan ruleradar:source-report 2>&1 | tail -c 2500 | enc)
          if [ "$code" -eq 0 ]; then
            echo "::notice title=Live Federal Register poll::$(tail -c 800 live-poll.log | enc)%0A${report}"
          else
            echo "::warning title=Live Federal Register poll failed (exit $code)::$(tail -c 2500 live-poll.log | enc)%0A${report}"
            exit 1
          fi
      - name: Dependency audit
        run: composer audit

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log
      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Unit tests
        run: |
          set -o pipefail
          npm run test 2>&1 | tee test.log
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Report web failures
        if: failure()
        run: |
          for f in lint typecheck test build; do
            [ -f "$f.log" ] || continue
            body=$(grep -v '^\s*$' "$f.log" | tail -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=npm run $f::${body}"
          done
      - name: Dependency audit
        # Shipped (production) dependencies fail on high or critical.
        # Dev-only tooling (lint, test runner) fails on critical: it never
        # reaches users, and some lint-tooling advisories have no fix yet.
        run: |
          annotate() {
            jq -r --arg lvl "$2" '.vulnerabilities // {} | to_entries[]
              | select(.value.severity as $s | ($lvl == "high" and ($s == "high" or $s == "critical")) or ($lvl == "critical" and $s == "critical") or ($lvl == "warn" and ($s == "high")))
              | "::\(if $lvl == "warn" then "warning" else "error" end) title=npm audit (\($ARGS.named.scope))::\(.key) \(.value.range) [\(.value.severity)] via \([.value.via[] | if type == "string" then . else .title end] | join("; "))"' --arg scope "$3" "$1"
          }
          npm audit --omit=dev --json > audit-prod.json || true
          npm audit --json > audit-all.json || true
          annotate audit-prod.json high production
          annotate audit-all.json critical dev
          annotate audit-all.json warn dev
          echo "::notice title=Resolved versions::$(npm ls next react eslint-config-next vitest tailwindcss --depth=0 2>/dev/null | tail -n +2 | tr '\n' ' ')"
          npm run audit:prod
          npm run audit:dev

  infra:
    name: Infrastructure (Bicep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile Bicep
        run: az bicep install && az bicep build --file infra/main.bicep --stdout > /dev/null

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # The real stack: Laravel API on Postgres (restricted role, RLS on),
    # the production Next.js build, and Chromium. The only stand-ins are the
    # recorded Federal Register responses and the e2e-only scripted model.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: e2e
      APP_DEBUG: "false"
      DB_DATABASE: ruleradar_e2e
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      LOG_STACK: single
      FRONTEND_URL: http://localhost:3000
      PHP_CLI_SERVER_WORKERS: "4"
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, redis
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Prepare database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ruleradar_app LOGIN PASSWORD 'ruleradar_app' NOSUPERUSER NOBYPASSRLS NOCREATEROLE" \
            -c "CREATE DATABASE ruleradar_e2e OWNER ruleradar_app"
          psql -h localhost -U postgres -d ruleradar_e2e -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
      - name: Start the API
        working-directory: apps/api
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env && php artisan key:generate
          php artisan migrate --force --seed
          php artisan ruleradar:e2e-prepare
          nohup php artisan serve --host=127.0.0.1 --port=8000 --no-reload > ../../api-server.log 2>&1 &
      - name: Build and start the web app
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm run build
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
          PORT=3000 HOSTNAME=localhost API_URL=http://127.0.0.1:8000 nohup node .next/standalone/server.js > ../../web-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null && curl -sf -o /dev/null http://localhost:3000/login && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/v1/health
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_LOG: ${{ github.workspace }}/apps/api/storage/logs/laravel.log
        run: npm run e2e
      - name: Report failures
        if: failure()
        run: |
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          [ -f apps/web/e2e-results.xml ] && python3 .github/scripts/junit-annotations.py apps/web/e2e-results.xml || true
          # The page as the browser saw it when the step failed.
          for f in $(find apps/web/test-results -name error-context.md 2>/dev/null); do
            echo "::error title=Page at failure::$(head -c 3500 "$f" | enc)"
          done
          for f in api-server.log web-server.log apps/api/storage/logs/laravel.log; do
            [ -f "$f" ] && echo "::error title=$(basename $f) (tail)::$(grep -v 'Content-Transfer\|^--' "$f" | tail -c 3000 | enc)" || true
          done
      - name: Keep the trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
